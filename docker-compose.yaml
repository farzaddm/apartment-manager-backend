services:
  postgres_db:
    image: postgres:alpine
    container_name: apt_postgres_db
    # ... your environment and healthcheck configs ...
    networks:
      - apt_network

  redis:
    image: redis:alpine
    container_name: apt_redis_cache
    networks:
      - apt_network

  migration:
    build:
      context: .
      dockerfile: Dockerfile.migration
    container_name: apt_migration
    # ... your volumes and env_file configs ...
    networks:
      - apt_network
    depends_on:
      postgres_db:
        condition: service_healthy

  backend:
    # This is your Gin/Go backend service
    image: ghcr.io/matinhab05/apartment-manager-backend/apt_backend:latest
    container_name: apt_backend
    # ... your ports, env_file, etc ...
    networks:
      - apt_network # <-- FIX: Add this line here!
    depends_on:
      postgres_db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migration:
        condition: service_completed_successfully

# Crucial: Define the network down here exactly like this
networks:
  apt_network:
    driver: bridge
